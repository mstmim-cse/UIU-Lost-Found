<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Page Not Found | UIU Lost & Found</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body style="display: flex; flex-direction: column; min-height: 100vh;">

    <!-- Navbar -->
    <nav class="navbar">
        <div class="container">
            <a href="index.html" class="logo">
                <i class="fas fa-search-location"></i> UIU L&F
            </a>
            <div class="nav-actions">
                <a href="dashboard.html" class="btn btn-primary">Go to Dashboard</a>
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <main class="section" style="flex: 1; display: flex; align-items: center; justify-content: center; text-align: center;">
        <div class="container">
            <i class="fas fa-ghost" style="font-size: 6rem; color: var(--primary); margin-bottom: 24px;"></i>
            <h1 style="font-size: 3rem; margin-bottom: 16px;">404</h1>
            <h2 style="margin-bottom: 16px;">Page Not Found</h2>
            <p style="color: var(--text-secondary); max-width: 400px; margin: 0 auto 32px auto;">It seems we've lost this page. Or maybe it was never found. Either way, let's get you back on track.</p>
            <a href="dashboard.html" class="btn btn-primary">Return to Dashboard</a>
        </div>
    </main>

    <!-- Footer -->
    <footer style="background-color: var(--surface-color); padding: 40px 0; border-top: 1px solid var(--border-color); text-align: center;">
        <div class="container">
            <p style="color: var(--text-secondary); font-size: 0.875rem;">
                &copy; 2026 UIU Lost & Found. 
                | <a href="faq.html" style="color: var(--primary); text-decoration: none;">FAQ</a>
                | <a href="privacy.html" style="color: var(--primary); text-decoration: none;">Privacy Policy</a>
                | <a href="terms.html" style="color: var(--primary); text-decoration: none;">Terms of Service</a>
            </p>
        </div>
    </footer>

</body>
</html>
